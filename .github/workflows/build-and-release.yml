name: Build and Release

# Runs on every push to main (including PR merges): build + publish a GitHub
# release. The release body is the newest dated section of CHANGELOG.md, plus a
# link to the full changelog.

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  build:
    name: Build (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
        include:
          - os: macos-latest
            build_command: build:mac
          - os: windows-latest
            build_command: build:win

    runs-on: ${{ matrix.os }}
    env:
      NODE_OPTIONS: '--max-old-space-size=8192'

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Type check
        run: npm run typecheck

      - name: Run unit tests
        run: npm test -- --coverage

      - name: Build app
        run: npm run ${{ matrix.build_command }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # Only upload artifacts for the release job (push to main).
      - name: Upload artifacts
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.os }}-artifacts
          path: |
            ./dist/**/*.dmg
            ./dist/**/*.pkg
            ./dist/**/*.exe
          # A build that failed to produce installers shouldn't fail this step —
          # the release job runs regardless and will publish notes without assets.
          if-no-files-found: warn
          # These are only needed to hand builds to the release job; don't let
          # them linger in the Actions tab.
          retention-days: 1

  release:
    name: Publish Release
    needs: build
    # Publish the release even if the build job failed or produced no installers.
    # `!cancelled()` runs on build success OR failure (but not on manual cancel);
    # any binaries that did build are attached, otherwise a notes-only release is
    # published.
    if: ${{ !cancelled() && github.event_name == 'push' && github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Read version from package.json
        id: version
        run: |
          VERSION=$(node -p "require('./package.json').version")
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"
          echo "Package version: $VERSION"

      - name: Check for existing tag
        id: check-tag
        run: |
          if git rev-parse --verify "refs/tags/v${VERSION}" >/dev/null 2>&1; then
            echo "Tag v${VERSION} already exists on the remote; skipping release."
            echo "skip=true" >> "$GITHUB_OUTPUT"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Download all build artifacts
        # Don't fail the release if a build produced no artifacts to download.
        if: steps.check-tag.outputs.skip != 'true'
        continue-on-error: true
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: List downloaded artifacts
        if: steps.check-tag.outputs.skip != 'true'
        run: |
          echo "Downloaded artifacts:"
          find ./artifacts -type f 2>/dev/null | sort || echo "(none — build produced no installers)"

      - name: Build release notes from CHANGELOG
        if: steps.check-tag.outputs.skip != 'true'
        run: |
          # The release body is the newest dated section of CHANGELOG.md only:
          # from the first "### YYYY-MM-DD" heading up to the next one. Fails
          # loudly if the file or a dated heading is missing.
          if [ ! -f CHANGELOG.md ]; then
            echo "Error: CHANGELOG.md not found" >&2
            exit 1
          fi

          # Bracket ranges rather than {4} intervals, so this works with any awk.
          awk '
            /^### [0-9][0-9][0-9][0-9]-[0-9][0-9]-[0-9][0-9]/ {
              if (seen) exit
              seen = 1
            }
            seen
          ' CHANGELOG.md > update-summary.md

          if [ ! -s update-summary.md ]; then
            echo "Error: no dated '### YYYY-MM-DD' section found in CHANGELOG.md" >&2
            exit 1
          fi

          {
            echo "# Bedrock Engineer v${VERSION}"
            echo
            echo "## Update summary"
            echo
            cat update-summary.md
            echo
            echo "Full changelog: ${{ github.server_url }}/${{ github.repository }}/blob/main/CHANGELOG.md"
          } > RELEASE_NOTES.md

          echo "----- Release notes preview -----"
          cat RELEASE_NOTES.md
          echo "---------------------------------"

      - name: Create GitHub Release
        if: steps.check-tag.outputs.skip != 'true'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ env.VERSION }}
          name: v${{ env.VERSION }}
          body_path: RELEASE_NOTES.md
          files: |
            artifacts/**/*.dmg
            artifacts/**/*.pkg
            artifacts/**/*.exe
          # Publish even when no installers were built (notes-only release).
          fail_on_unmatched_files: false
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # Keep binaries only on the release we just published. Older releases keep
      # their tag and notes but shed their (large) downloadable assets.
      - name: Prune assets from older releases
        if: steps.check-tag.outputs.skip != 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CURRENT_TAG: v${{ env.VERSION }}
        run: |
          set -euo pipefail

          # All release tags except the one we just published.
          tags=$(gh release list --limit 1000 --json tagName --jq '.[].tagName' \
            | grep -vxF "$CURRENT_TAG" || true)

          if [ -z "$tags" ]; then
            echo "No older releases to prune."
            exit 0
          fi

          while IFS= read -r tag; do
            [ -z "$tag" ] && continue
            assets=$(gh release view "$tag" --json assets --jq '.assets[].name' || true)
            if [ -z "$assets" ]; then
              echo "Release $tag has no assets; nothing to prune."
              continue
            fi
            while IFS= read -r asset; do
              [ -z "$asset" ] && continue
              echo "Deleting asset '$asset' from release $tag"
              gh release delete-asset "$tag" "$asset" --yes
            done <<< "$assets"
          done <<< "$tags"
