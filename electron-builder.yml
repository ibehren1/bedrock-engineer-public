appId: com.electron.app
# productName is intentionally omitted here so it is sourced from package.json
# (single source of truth for the app display name).
directories:
  buildResources: build
files:
  - '!**/.vscode/*'
  - '!src/*'
  - '!electron.vite.config.{js,ts,mjs,cjs}'
  - '!{.eslintignore,.eslintrc.cjs,.prettierignore,.prettierrc.yaml,CHANGELOG.md,README.md}'
  - '!{.env,.env.*,.npmrc,pnpm-lock.yaml}'
  - '!{tsconfig.json,tsconfig.node.json,tsconfig.web.json}'
asarUnpack:
  - resources/**
extraResources:
  - from: 'src/renderer/src/assets/directory-agents'
    to: 'directory-agents'
  - from: 'public/worklets'
    to: 'worklets'
  - from: 'src/renderer/camera-preview.html'
    to: 'renderer/camera-preview.html'
  # The Help chat attaches this guide, so the build has to carry the copy that matches it.
  - from: 'docs/USER_GUIDE.md'
    to: 'docs/USER_GUIDE.md'
win:
  # executableName intentionally omitted: defaults to productName from package.json.
nsis:
  artifactName: ${name}-${version}-setup.${ext}
  shortcutName: ${productName}
  uninstallDisplayName: ${productName}
  createDesktopShortcut: always
mac:
  identity: '-'
  entitlementsInherit: build/entitlements.mac.plist
  extendInfo:
    - NSCameraUsageDescription: Application requests access to the device's camera.
    - NSMicrophoneUsageDescription: Application requests access to the device's microphone.
    - NSAudioCaptureUsageDescription: Application requests access to the device's audio for screen capture.
    - NSDocumentsFolderUsageDescription: Application requests access to the user's Documents folder.
    - NSDownloadsFolderUsageDescription: Application requests access to the user's Downloads folder.
  notarize: false
  target:
    - dmg
    - pkg
dmg:
  artifactName: ${name}-${version}.${ext}
pkg:
  artifactName: ${name}-${version}.${ext}
linux:
  target:
    - AppImage
    - snap
    - deb
  maintainer: electronjs.org
  category: Utility
appImage:
  artifactName: ${name}-${version}.${ext}
npmRebuild: false
